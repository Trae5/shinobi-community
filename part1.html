<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shinobi Community — Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0709;--panel:#150d10;--panel2:#1d1216;--panel3:#241820;--line:#37222a;--line2:#4a2f38;--gold:#dfb963;--gold2:#f3d98a;--red:#8a1c1c;--red2:#b32626;--ink:#efe3c8;--dim:#a5907f;--faint:#7d6a5e;--green:#4fae6a;--amber:#e0a53c;--blue:#5a8ec2;--violet:#9a6fc2}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;min-height:100vh}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(138,28,28,.30),transparent 70%),radial-gradient(ellipse 60% 40% at 50% 110%,rgba(223,185,99,.06),transparent 70%);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 16px 70px}
header{padding:30px 0 4px;text-align:center}
h1{font-family:Cinzel,serif;font-weight:900;font-size:clamp(26px,5.5vw,42px);color:var(--gold);letter-spacing:.12em;text-transform:uppercase}
.sub{color:var(--dim);font-size:13.5px;margin-top:5px;letter-spacing:.06em}
nav{position:sticky;top:0;z-index:60;background:rgba(12,7,9,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:18px 0 22px;padding:9px 0}
.navrow{display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none;justify-content:center}
.navrow::-webkit-scrollbar{display:none}
nav button{font-family:Cinzel,serif;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:transparent;color:var(--dim);border:1px solid transparent;border-radius:18px;padding:8px 13px;cursor:pointer;transition:.15s;white-space:nowrap;position:relative}
nav button:hover{color:var(--gold)}
nav button.on{color:var(--gold2);border-color:var(--gold);background:rgba(223,185,99,.08)}
nav .bellbtn::after{content:attr(data-count);position:absolute;top:-4px;right:-2px;background:var(--red2);color:#fff;font-size:9.5px;font-weight:700;font-family:Inter;border-radius:9px;padding:1px 5px;display:none}
nav .bellbtn.has::after{display:block}
.view{display:none;animation:fade .22s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
h2{font-family:Cinzel,serif;color:var(--gold);font-size:19px;letter-spacing:.08em;margin:6px 0 4px;text-transform:uppercase}
h3.sect{font-family:Cinzel,serif;color:var(--gold);font-size:13.5px;letter-spacing:.1em;text-transform:uppercase;margin:20px 0 10px}
.lead{color:var(--dim);font-size:13.5px;line-height:1.6;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.panel{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:13px;padding:18px;transition:border-color .15s}
.panel:hover{border-color:var(--line2)}
.panel h3.inp{font-family:Cinzel,serif;color:var(--gold2);font-size:14.5px;letter-spacing:.05em;margin-bottom:10px;text-transform:uppercase}
.hero{background:linear-gradient(135deg,var(--panel),var(--panel3));border:1px solid var(--line2);border-radius:14px;padding:20px 22px;margin-bottom:16px}
.hero .hello{font-size:17px;font-weight:600;color:var(--ink)}
.hero .hello b{color:var(--gold2)}
.hero p{color:var(--dim);font-size:13.5px;line-height:1.6;margin-top:6px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:7px;font-family:Cinzel,serif;font-weight:700;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--bg);background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:8px;padding:10px 16px;cursor:pointer;transition:.15s;text-decoration:none}
.btn:hover{filter:brightness(1.09);transform:translateY(-1px)}
.btn:active{transform:none}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn.danger{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff}
.btn.mini{padding:6px 11px;font-size:10.5px;border-radius:7px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 16px;align-items:center}
.filters button{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;background:var(--panel);color:var(--dim);border:1px solid var(--line);border-radius:15px;padding:6px 13px;cursor:pointer;transition:.15s}
.filters button:hover{color:var(--ink)}
.filters button.on{color:var(--gold2);border-color:var(--gold);background:rgba(223,185,99,.08)}
.filters .sep{width:10px}
.searchbox{display:flex;gap:8px;margin-bottom:14px}
.searchbox input{flex:1;background:#0f0a0c;border:1px solid var(--line);border-radius:9px;color:var(--ink);font-family:Inter;font-size:14px;padding:10px 13px}
.searchbox input:focus{outline:none;border-color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--red2);border-radius:11px;padding:15px 17px;margin-bottom:11px;transition:.15s}
.card:hover{border-color:var(--line2);border-left-color:var(--red2);background:var(--panel2)}
.card.fx{border-left-color:var(--green)}
.card.fq{border-left-color:var(--gold)}
.card.dis{border-left-color:var(--blue)}
.card.ann{border-left-color:var(--gold2)}
.card.hidden{opacity:.55;border-left-color:var(--faint)}
.card .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.card h4{color:var(--ink);font-size:15px;font-weight:700;line-height:1.35;cursor:pointer}
.card h4:hover{color:var(--gold2)}
.card p{color:var(--dim);font-size:13px;line-height:1.6;margin-top:7px;white-space:pre-wrap;word-wrap:break-word}
.card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap;gap:8px}
.who{color:var(--faint);font-size:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.who .who-name{color:var(--dim);font-weight:600;cursor:pointer}
.who .who-name:hover{color:var(--gold)}
.badge{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;border-radius:9px;padding:3px 9px;white-space:nowrap;display:inline-block}
.badge.new{background:rgba(90,142,194,.14);color:#9cc4ec;border:1px solid rgba(90,142,194,.4)}
.badge.open{background:rgba(179,38,38,.18);color:#ff9a8a;border:1px solid rgba(179,38,38,.45)}
.badge.confirmed{background:rgba(179,38,38,.24);color:#ffb0a0;border:1px solid rgba(179,38,38,.55)}
.badge.investigating{background:rgba(224,165,60,.15);color:#f2c477;border:1px solid rgba(224,165,60,.45)}
.badge.fixing{background:rgba(224,165,60,.22);color:#ffd28a;border:1px solid rgba(224,165,60,.55)}
.badge.fixed{background:rgba(79,174,106,.15);color:#8fe0a8;border:1px solid rgba(79,174,106,.4)}
.badge.closed{background:rgba(125,106,94,.15);color:#b8a79b;border:1px solid rgba(125,106,94,.4)}
.badge.review{background:rgba(90,142,194,.14);color:#9cc4ec;border:1px solid rgba(90,142,194,.4)}
.badge.considering{background:rgba(154,111,194,.15);color:#c9a8e8;border:1px solid rgba(154,111,194,.45)}
.badge.planned{background:rgba(223,185,99,.12);color:var(--gold);border:1px solid rgba(223,185,99,.4)}
.badge.dev{background:rgba(224,165,60,.22);color:#ffd28a;border:1px solid rgba(224,165,60,.55)}
.badge.implemented{background:rgba(79,174,106,.2);color:#a5ecb8;border:1px solid rgba(79,174,106,.5)}
.badge.declined{background:rgba(125,106,94,.15);color:#b8a79b;border:1px solid rgba(125,106,94,.4)}
.badge.meta{background:rgba(223,185,99,.1);color:var(--gold);border:1px solid rgba(223,185,99,.35)}
.badge.sev{border:1px solid rgba(179,38,38,.5);background:rgba(179,38,38,.2);color:#ff9a8a}
.badge.sev.med{border-color:rgba(224,165,60,.5);background:rgba(224,165,60,.15);color:#f2c477}
.badge.sev.low{border-color:rgba(90,142,194,.4);background:rgba(90,142,194,.12);color:#9cc4ec}
.badge.pin{background:rgba(223,185,99,.16);color:var(--gold2);border:1px solid var(--gold)}
.badge.done{background:rgba(223,185,99,.16);color:var(--gold2);border:1px solid var(--gold)}
.badge.bdg{background:linear-gradient(135deg,rgba(223,185,99,.16),rgba(179,38,38,.12));color:var(--gold2);border:1px solid rgba(223,185,99,.5)}
.devreply{margin-top:10px;background:rgba(223,185,99,.06);border:1px solid rgba(223,185,99,.3);border-left:3px solid var(--gold);border-radius:8px;padding:10px 13px;font-size:13px;color:var(--ink);line-height:1.55}
.devreply b{color:var(--gold)}
.up{display:inline-flex;align-items:center;gap:6px;background:rgba(223,185,99,.07);border:1px solid var(--line);color:var(--gold);border-radius:15px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;user-select:none}
.up:hover{border-color:var(--gold)}
.up.mine{background:rgba(223,185,99,.18);border-color:var(--gold)}
.up.down{color:var(--dim)}
.up.down.mine{color:#ff9a8a;border-color:var(--red2);background:rgba(179,38,38,.14)}
.empty{color:var(--faint);text-align:center;padding:34px 0;font-size:13.5px;line-height:1.7}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 14px;text-align:center}
.stat b{display:block;font-family:Cinzel,serif;font-size:21px;color:var(--gold2)}
.stat span{color:var(--faint);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.feeditem{display:flex;gap:11px;align-items:flex-start;padding:11px 4px;border-bottom:1px solid rgba(55,34,42,.6)}
.feeditem:last-child{border-bottom:none}
.feeditem .fi-ic{width:28px;height:28px;border-radius:8px;background:var(--panel3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.feeditem .fi-tx{font-size:13px;color:var(--dim);line-height:1.5}
.feeditem .fi-tx b{color:var(--ink)}
.feeditem .fi-tx .when{color:var(--faint);font-size:11px;margin-left:6px}
.feeditem .fi-act{margin-left:auto;flex-shrink:0}
.gamechip{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:8px;padding:2px 8px;border:1px solid var(--line2);color:var(--dim);cursor:pointer}
.gamechip.lg{color:#9cc4ec;border-color:rgba(90,142,194,.4)}
.gamechip.lu{color:#c9a8e8;border-color:rgba(154,111,194,.4)}
.gamechip:hover{filter:brightness(1.2)}
.banner{display:none;background:rgba(179,38,38,.15);border:1px solid var(--red2);color:#ffb3a7;border-radius:10px;padding:12px 16px;font-size:13.5px;margin-bottom:14px}
.banner.ann{display:none;background:rgba(223,185,99,.08);border:1px solid var(--gold);color:var(--gold2);border-radius:10px;padding:12px 16px;font-size:13.5px;margin-bottom:14px;cursor:pointer;animation:pop .3s ease}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel3);border:1px solid var(--gold);color:var(--gold2);border-radius:10px;padding:11px 18px;font-size:13.5px;z-index:400;opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(5,2,3,.8);display:none;place-items:center;z-index:200;padding:16px;backdrop-filter:blur(3px)}
.modal.on{display:grid}
.mbox{background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:24px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;animation:pop .2s ease}
.mbox h3{font-family:Cinzel,serif;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-size:16.5px;margin-bottom:12px}
.mbox label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:12px 0 5px}
.mbox input,.mbox select,.mbox textarea{width:100%;background:#0f0a0c;border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:Inter;font-size:14px;padding:10px 12px}
.mbox textarea{min-height:90px;resize:vertical}
.mbox input:focus,.mbox select:focus,.mbox textarea:focus{outline:none;border-color:var(--gold)}
.mrow{display:flex;gap:10px;margin-top:18px}
.mrow .btn{margin:0;flex:1;justify-content:center}
.avatar{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:16px;background:var(--panel3);border:1px solid var(--line2);flex-shrink:0}
.avatar.lg{width:64px;height:64px;font-size:30px}
.msg{max-width:82%}
.msg .nm{font-size:11.5px;font-weight:700;color:var(--gold);letter-spacing:.04em;margin-bottom:3px}
.msg .tx{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-size:14px;line-height:1.5;word-wrap:break-word}
.msg.me{align-self:flex-end}
.msg.me .tx{background:rgba(223,185,99,.14);border-color:rgba(223,185,99,.4)}
.msg .tm{font-size:10.5px;color:var(--faint);margin-top:3px}
.chatwrap{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.chatlog{height:52vh;min-height:300px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.chatbar{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--panel2)}
.chatbar input{flex:1;background:#0f0a0c;border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:11px 14px;font-size:14px}
.chatbar input:focus{outline:none;border-color:var(--gold)}
.chatbar button{font-family:Cinzel,serif;font-weight:700;color:var(--bg);background:var(--gold);border:none;border-radius:10px;padding:0 20px;cursor:pointer;letter-spacing:.06em}
.lbrow{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid rgba(55,34,42,.6)}
.lbrow:last-child{border:none}
.lbrow .rank{font-family:Cinzel,serif;font-weight:900;color:var(--gold);width:30px;text-align:center;font-size:15px}
.lbrow .who-name{font-weight:700;color:var(--ink);cursor:pointer}
.lbrow .who-name:hover{color:var(--gold2)}
.lbrow .lbstat{margin-left:auto;color:var(--dim);font-size:12.5px;text-align:right}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;background:var(--panel);color:var(--dim);border:1px solid var(--line);border-radius:15px;padding:6px 13px;cursor:pointer}
.tabs button.on{color:var(--gold2);border-color:var(--gold)}
.comment{border-left:2px solid var(--line2);margin:9px 0 0 12px;padding:8px 0 8px 14px}
.comment .ct{font-size:13.5px;color:var(--ink);line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.comment .cmeta{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:11px;color:var(--faint);flex-wrap:wrap}
.comment .cmeta .like{cursor:pointer;color:var(--dim)}
.comment .cmeta .like:hover,.comment .cmeta .like.on{color:var(--gold)}
.comment .cmeta .replybtn{cursor:pointer;color:var(--faint)}
.comment .cmeta .replybtn:hover{color:var(--gold)}
.cbox{display:flex;gap:8px;margin-top:12px}
.cbox input{flex:1;background:#0f0a0c;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:9px 12px;font-size:13.5px}
.cbox input:focus{outline:none;border-color:var(--gold)}
.reactions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.rx{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:3px 10px;font-size:13px;cursor:pointer;transition:.15s}
.rx:hover{border-color:var(--gold)}
.rx.mine{border-color:var(--gold);background:rgba(223,185,99,.14)}
.status-track{display:flex;gap:0;margin:12px 0;flex-wrap:wrap}
.status-track span{flex:1;min-width:70px;text-align:center;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:7px 2px;border-bottom:2px solid var(--line)}
.status-track span.hit{color:var(--gold2);border-color:var(--gold);font-weight:700}
footer{text-align:center;color:var(--faint);font-size:12px;margin-top:44px;line-height:2}
footer a{color:var(--gold)}
.pillrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill2{display:inline-block;margin-top:9px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line);border-radius:12px;padding:4px 12px;transition:.3s}
.pill2.on{color:#8fe0a8;border-color:rgba(79,174,106,.45)}
.pill2.off{color:#ff9a8a;border-color:rgba(179,38,38,.5)}
kbd{background:var(--panel3);border:1px solid var(--line2);border-radius:5px;padding:1px 6px;font-size:11px;color:var(--gold)}
.avatar{overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
</style>
</head>
